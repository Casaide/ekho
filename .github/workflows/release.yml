name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    name: Signed APK release
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm install
      - name: Signing key
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.keystore
            echo "SIGN=--sign --keystore release.keystore --keystore-key $KEY_ALIAS --keystore-password pass:$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE secret: building with the debug key, as a pre-release."
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: >
          npx bare-build app.ts
          --host android-arm64
          --runtime bare-native/runtime
          --name ekho
          --identifier casa.cassidy.ekho
          --android-manifest android/AndroidManifest.xml
          --out build
          $SIGN
      - name: Publish release
        run: |
          mv build/ekho.apk "build/ekho-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "build/ekho-${GITHUB_REF_NAME}.apk" \
            --title "ekho $GITHUB_REF_NAME" --generate-notes $PRERELEASE
      - name: Remove the key
        if: always()
        run: rm -f release.keystore
