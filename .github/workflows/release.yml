name: Release
# Every merge to main that changes the app is a release. The version comes from the Conventional
# Commits since the last tag: a breaking change bumps minor while we're on 0.x
# (major after 1.0), feat bumps minor, anything else bumps patch. The first
# release takes the version in package.json.
on:
  push:
    branches:
      - main
    # Nothing to release when only the docs, the README or its screenshots
    # changed; they go out with the next release that changes the app.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'scripts/demo-state.py'
      - '.github/workflows/screens.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    name: Release with APK
    # Creates the release and its tag.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Google Play (see README, "Releasing to testers"): with the upload key,
      # the release also gets a signed app bundle; with the service account
      # too, the bundle goes to internal testing.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      TO_PLAY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=$(node -p "require('./package.json').version")
          else
            log=$(git log --format='%s%n%b' "$last..HEAD")
            IFS=. read -r major minor patch <<< "${last#v}"
            if printf '%s\n' "$log" | grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING CHANGE'; then
              if [ "$major" = 0 ]; then minor=$((minor + 1)); patch=0
              else major=$((major + 1)); minor=0; patch=0; fi
            elif printf '%s\n' "$log" | grep -qE '^feat(\(.+\))?:'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "Releasing v$next (last release: ${last:-none})"
          echo "VERSION=$next" >> "$GITHUB_ENV"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # Our own addons (packages/), compiled here: they aren't on npm.
      - name: Native addons
        run: sh scripts/build-addons.sh android
      - run: npm install
      - name: QVAC for Android
        run: sh scripts/qvac-hosts.sh android-arm64
      # A fixed, public debug key, so each build installs over the last one.
      # Temporary: replace with a private release key (see README) before
      # handing the app out widely.
      - name: Stable debug key
        run: mkdir -p ~/.android && cp android/debug.keystore ~/.android/debug.keystore
      # bare-build reads the app version from package.json.
      - run: npm pkg set version="$VERSION"
      - name: Signing key
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.keystore
            echo "SIGN=--sign --keystore release.keystore --keystore-key $KEY_ALIAS --keystore-password pass:$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE secret: building with the debug key, as a pre-release."
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: >
          npx bare-build app.ts
          --host android-arm64
          --runtime bare-native/runtime
          --name ekho
          --identifier casa.cassidy.ekho
          --android-manifest android/AndroidManifest.xml
          --resources android/res
          --minimum-version 33
          --defer bare-notifications-darwin
          --defer bare-open-url-darwin
          --out build
          $SIGN
      - name: App bundle for Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        run: >
          npx bare-build app.ts
          --package
          --host android-arm64
          --runtime bare-native/runtime
          --name ekho
          --identifier casa.cassidy.ekho
          --android-manifest android/AndroidManifest.xml
          --resources android/res
          --minimum-version 33
          --defer bare-notifications-darwin
          --defer bare-open-url-darwin
          --out bundle
      # bare-build leaves the bundle unsigned; Play takes it signed with the
      # upload key, and signs what it hands out with its own.
      - name: Sign the app bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 bundle/ekho.aab upload
          mv bundle/ekho.aab "bundle/ekho-v$VERSION.aab"
      - name: Publish release
        # Creating the release creates the tag on the merged commit.
        run: |
          mv build/ekho.apk "build/ekho-v$VERSION.apk"
          aab=$(ls bundle/*.aab 2>/dev/null || true)
          gh release create "v$VERSION" "build/ekho-v$VERSION.apk" $aab \
            --target "$GITHUB_SHA" --title "ekho v$VERSION" --generate-notes $PRERELEASE
      - uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        if: env.TO_PLAY == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Send to Google Play internal testing
        if: env.TO_PLAY == 'true'
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # A repository variable: draft until the app's first release on Play.
          RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          LC_ALL: C.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          printf '%s' "$PLAY_KEY" > fastlane/play-service-account.json
          bundle exec fastlane android internal aab:"bundle/ekho-v$VERSION.aab" release_status:"$RELEASE_STATUS"
      - name: Remove the keys
        if: always()
        run: rm -f release.keystore "$RUNNER_TEMP/upload.jks" fastlane/play-service-account.json
  macos:
    # The macOS app, added to the release the job above made.
    needs: release
    runs-on: macos-latest
    name: Add the macOS app
    # Uploads to the release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Native addons
        run: sh scripts/build-addons.sh darwin
      - run: npm install
      - name: QVAC for both Macs
        run: sh scripts/qvac-hosts.sh darwin-arm64 darwin-x64
      - run: npm pkg set version="$VERSION"
      - run: scripts/build-macos.sh
      - name: Upload
        run: |
          mv build/ekho-macos.zip "build/ekho-v$VERSION-macos.zip"
          gh release upload "v$VERSION" "build/ekho-v$VERSION-macos.zip" --repo "$GITHUB_REPOSITORY"
