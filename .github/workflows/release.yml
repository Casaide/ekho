name: Release
# Every merge to main is a release. The version comes from the Conventional
# Commits since the last tag: a breaking change bumps minor while we're on 0.x
# (major after 1.0), feat bumps minor, anything else bumps patch. The first
# release takes the version in package.json.
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    name: Release with APK
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Next version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=$(node -p "require('./package.json').version")
          else
            log=$(git log --format='%s%n%b' "$last..HEAD")
            IFS=. read -r major minor patch <<< "${last#v}"
            if printf '%s\n' "$log" | grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING CHANGE'; then
              if [ "$major" = 0 ]; then minor=$((minor + 1)); patch=0
              else major=$((major + 1)); minor=0; patch=0; fi
            elif printf '%s\n' "$log" | grep -qE '^feat(\(.+\))?:'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "Releasing v$next (last release: ${last:-none})"
          echo "VERSION=$next" >> "$GITHUB_ENV"
      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm install
      # A fixed, public debug key, so each build installs over the last one.
      # Temporary: replace with a private release key (see README) before
      # handing the app out widely.
      - name: Stable debug key
        run: mkdir -p ~/.android && cp android/debug.keystore ~/.android/debug.keystore
      # bare-build reads the app version from package.json.
      - run: npm pkg set version="$VERSION"
      - name: Signing key
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.keystore
            echo "SIGN=--sign --keystore release.keystore --keystore-key $KEY_ALIAS --keystore-password pass:$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE secret: building with the debug key, as a pre-release."
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: >
          npx bare-build app.ts
          --host android-arm64
          --runtime bare-native/runtime
          --name ekho
          --identifier casa.cassidy.ekho
          --android-manifest android/AndroidManifest.xml
          --resources android/res
          --out build
          $SIGN
      - name: Publish release
        # Creating the release creates the tag on the merged commit.
        run: |
          mv build/ekho.apk "build/ekho-v$VERSION.apk"
          gh release create "v$VERSION" "build/ekho-v$VERSION.apk" \
            --target "$GITHUB_SHA" --title "ekho v$VERSION" --generate-notes $PRERELEASE
      - name: Remove the key
        if: always()
        run: rm -f release.keystore
