# The wiki's pages live in docs/wiki/, reviewed with the code they describe,
# and are published to the GitHub wiki on every merge that changes them. The
# wiki needs one page made by hand first (GitHub makes its repository then).
name: Wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish docs/wiki
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/$REPO.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'The wiki is up to date.'
            exit 0
          fi
          git commit -m "Publish docs/wiki from ${GITHUB_SHA::7}"
          git push
