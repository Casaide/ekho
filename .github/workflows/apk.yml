name: APK
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # Our own addons (packages/), compiled here: they aren't on npm.
      - name: Native addons
        run: sh scripts/build-addons.sh
      - name: Dependencies against npm
        run: node -e "const p=require('./package.json');for(const [n,r] of Object.entries({...p.dependencies,...p.devDependencies}))console.log(n,r)" | while read n r; do case $r in file:*) continue;; esac; echo "$n $r latest $(npm view $n version)"; done
      - run: npm install
      # A fixed, public debug key, so each build installs over the last one.
      # Temporary: replace with a private release key (see README) before
      # handing the app out widely.
      - name: Stable debug key
        run: mkdir -p ~/.android && cp android/debug.keystore ~/.android/debug.keystore
      - name: Build
        run: >
          npx bare-build app.ts
          --host android-arm64
          --runtime bare-native/runtime
          --name ekho
          --identifier casa.cassidy.ekho
          --android-manifest android/AndroidManifest.xml
          --resources android/res
          --minimum-version 33
          --out build
      - name: What's inside
        # Native libraries and Java code packed into the APK, to check that
        # addons such as bare-navigation-android made it in.
        run: unzip -l build/*.apk | grep -E '\.so$|\.dex$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ekho-apk
          path: build/*.apk
          if-no-files-found: error
