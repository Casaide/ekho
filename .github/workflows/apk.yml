name: APK
on:
  push:
    branches:
      - main
      - first-attempt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Published versions
        run: for p in b4a bare-bluetooth bare-events bare-meshtastic bare-native bare-tls bare-build bare-native-test bare-tap lunte prettier prettier-config-holepunch typescript bare-fs bare-os bare-path; do echo "$p $(npm view $p version 2>/dev/null)"; done
      - run: npm install
      - name: Build
        run: >
          npx bare-build app.ts
          --host android-arm64
          --runtime bare-native/runtime
          --name ekho
          --identifier casa.cassidy.ekho
          --android-manifest android/AndroidManifest.xml
          --out build
      - uses: actions/upload-artifact@v4
        with:
          name: ekho-apk
          path: build/*.apk
          if-no-files-found: error
