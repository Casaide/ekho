name: APK
on:
  push:
    branches:
      - main
      - first-attempt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Dependencies against npm
        run: node -e "const p=require('./package.json');for(const [n,r] of Object.entries({...p.dependencies,...p.devDependencies}))console.log(n,r)" | while read n r; do echo "$n $r latest $(npm view $n version)"; done
      - run: npm install
      - name: Build
        run: >
          npx bare-build app.ts
          --host android-arm64
          --runtime bare-native/runtime
          --name ekho
          --identifier casa.cassidy.ekho
          --android-manifest android/AndroidManifest.xml
          --out build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ekho-apk
          path: build/*.apk
          if-no-files-found: error
