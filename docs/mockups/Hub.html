<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Radio</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            background: #0a0d0c;
          }
          a {
            color: #d8e2dd;
          }
          a:hover {
            color: #ffffff;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #0a0d0c;
          color: #d8e2dd;
          font-family: 'JetBrains Mono', ui-monospace, monospace;
          display: flex;
          flex-direction: column;
        "
      >
        <div
          style="
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            overflow: hidden;
          "
        >
          <h1 style="margin: 0; font-size: 18px; font-weight: 700">
            <span style="color: #7c8a84">~/</span>radio
          </h1>

          <div
            style="
              border: 1px solid #1e2522;
              border-radius: 6px;
              background: #111614;
              padding: 14px;
              display: flex;
              flex-direction: column;
              gap: 14px;
            "
          >
            <div style="display: flex; align-items: center; gap: 8px">
              <span
                style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}; box-shadow: 0 0 8px {{accent}}"
              ></span>
              <span style="font-size: 14px; font-weight: 700">t1000-e</span>
              <span style="margin-left: auto; font-size: 12px; color: {{accent}}"
                >connected · ble</span
              >
            </div>
            <div
              style="
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                font-size: 12px;
              "
            >
              <div style="display: flex; flex-direction: column; gap: 3px">
                <span style="color: #7c8a84">node</span><span>!e2f4a910 · DOM</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 3px">
                <span style="color: #7c8a84">battery</span><span>[NN]%</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 3px">
                <span style="color: #7c8a84">nodes heard</span><span>[N] · last 15m</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 3px">
                <span style="color: #7c8a84">channel use</span><span>[NN]%</span>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 11px">
              <div style="display: flex; justify-content: space-between; color: #7c8a84">
                <span>airtime used (1h)</span><span style="color: #d8e2dd">[NN]%</span>
              </div>
              <div style="height: 6px; background: #1e2522; border-radius: 1px; overflow: hidden">
                <div style="width: 22%; height: 6px; background: {{accent}}"></div>
              </div>
            </div>
          </div>

          <h2 style="margin: 6px 0 0 0; font-size: 11px; font-weight: 500; color: #7c8a84">
            // identity
          </h2>
          <div
            style="
              border: 1px solid #1e2522;
              border-radius: 6px;
              padding: 12px;
              display: flex;
              flex-direction: column;
              gap: 6px;
              font-size: 12px;
            "
          >
            <div style="display: flex; justify-content: space-between">
              <span>root key</span><span style="color: {{accent}}">on device</span>
            </div>
            <span style="color: #a9b5b0">a7f3 91c0 2be4 … 0d6e</span>
            <button
              style="
                align-self: flex-start;
                margin-top: 4px;
                height: 32px;
                padding: 0 10px;
                border: 1px solid #2a332f;
                border-radius: 4px;
                background: transparent;
                color: #d8e2dd;
                font: inherit;
                font-size: 11px;
              "
            >
              back up key
            </button>
          </div>

          <h2 style="margin: 6px 0 0 0; font-size: 11px; font-weight: 500; color: #7c8a84">
            // paths
          </h2>
          <div style="border: 1px solid #1e2522; border-radius: 6px; overflow: hidden">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-bottom: 1px solid #161c1a;
                min-height: 44px;
              "
            >
              <div style="display: flex; flex-direction: column; gap: 3px; flex: 1">
                <span style="font-size: 13px; font-weight: 700">lora</span
                ><span style="font-size: 11px; color: #7c8a84">primary · EU868 · LongFast</span>
              </div>
              <span style="font-size: 11px; color: {{accent}}">active</span>
            </div>
            <a
              href="Setup.dc.html"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                min-height: 44px;
                text-decoration: none;
                color: #d8e2dd;
              "
            >
              <div style="display: flex; flex-direction: column; gap: 3px; flex: 1">
                <span style="font-size: 13px; font-weight: 700">irc</span
                ><span style="font-size: 11px; color: #7c8a84">fallback · logged in as dom</span>
              </div>
              <span style="font-size: 11px; color: #e8b04b">standby ›</span>
            </a>
          </div>
        </div>

        <nav
          style="
            height: 60px;
            border-top: 1px solid #1e2522;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            font-size: 12px;
          "
        >
          <a
            href="Main.dc.html"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
              color: #7c8a84;
            "
            >chats</a
          >
          <a
            href="Contact.dc.html"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
              color: #7c8a84;
            "
            >contacts</a
          >
          <a
            href="Hub.dc.html"
            style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{accent}}; font-weight: 700; border-top: 2px solid {{accent}}; margin-top: -1px"
            >radio</a
          >
        </nav>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"accent":{"editor":"color","default":"#5CF29B","options":["#5CF29B","#7AA2F7","#E8B04B"]},"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          return { accent: this.props.accent ?? '#5CF29B' };
        }
      }
    </script>
  </body>
</html>
